name = "looping-louie"
main = "src/index.js"
compatibility_date = "2026-09-01"
workers_dev = true

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"

# SQLite-backed class: the only kind the Workers Free plan allows
[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]

# Play records (POST /s/…): one anonymous row per game and device, live since 1 Nov 2026.
# A schema change goes in a new migrations/000N_….sql (0001 has run), applied before the deploy:
#   npx wrangler d1 migrations apply looping-louie-stats --remote
#   npx wrangler deploy
[[d1_databases]]
binding = "STATS"
database_name = "looping-louie-stats"
database_id = "d9f962bc-42bb-4422-95f6-85f94c570b07"
migrations_dir = "migrations"
